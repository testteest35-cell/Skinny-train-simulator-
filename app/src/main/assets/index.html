<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Trainz: A New Era — 3D WebGL Train Simulator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(180deg, #173168 0%, #6988b8 40%, #f59556 68%, #2d5e26 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      color: #f8fafc;
      -webkit-font-smoothing: antialiased;
    }
    #webgl-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    /* Minimal, sleek, transparent HUD in corners only */
    .hud-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      padding: 18px 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 10;
    }
    .hud-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }
    .hud-row.bottom {
      align-items: flex-end;
    }
    .hud-card {
      background: rgba(15, 23, 42, 0.42);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 14px;
      padding: 10px 16px;
      pointer-events: auto;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.22);
    }
    .route-badge {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      font-weight: 500;
      color: rgba(248, 250, 252, 0.88);
    }
    .sig-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
      display: inline-block;
    }
    .divider {
      width: 1px;
      height: 12px;
      background: rgba(255, 255, 255, 0.2);
    }
    .telemetry-cluster {
      display: flex;
      align-items: baseline;
      gap: 20px;
    }
    .speed-readout {
      display: flex;
      align-items: baseline;
      gap: 5px;
    }
    .speed-number {
      font-size: 34px;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: #ffffff;
      line-height: 1;
    }
    .speed-unit {
      font-size: 12px;
      font-weight: 600;
      color: rgba(226, 232, 240, 0.75);
      text-transform: uppercase;
    }
    .metric-box {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .metric-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: rgba(203, 213, 225, 0.72);
    }
    .metric-value {
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
    }
    .metric-value.amber { color: #fbbf24; }
    .metric-value.cyan { color: #38bdf8; }
    .metric-value.red { color: #f87171; }
    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }
    .hud-btn {
      background: rgba(30, 41, 59, 0.55);
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 9px;
      padding: 7px 12px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
    }
    .hud-btn:hover {
      background: rgba(51, 65, 85, 0.8);
      border-color: rgba(251, 191, 36, 0.55);
    }
    .hud-btn:active {
      transform: scale(0.96);
    }
    .hud-btn.accent {
      background: rgba(245, 158, 11, 0.82);
      color: #0f172a;
      border-color: rgba(251, 191, 36, 0.9);
    }
    @media (max-width: 640px) {
      .hud-overlay { padding: 12px; }
      .speed-number { font-size: 26px; }
      .hud-card { padding: 8px 12px; }
      .telemetry-cluster { gap: 14px; }
    }
  </style>

  <!-- Three.js r164 ImportMap -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="webgl-container"></div>

  <!-- Minimal Transparent Corner HUD Overlay -->
  <div class="hud-overlay">
    <div class="hud-row">
      <!-- Top-Left: Compact Route & Camera Status -->
      <div class="hud-card route-badge">
        <span><span class="sig-dot" id="sig-dot"></span> <strong id="sig-text">CLEAR</strong></span>
        <span class="divider"></span>
        <span>Grade <strong id="grade-val">+0.0%</strong></span>
        <span class="divider"></span>
        <span>Cam: <strong id="cam-label" style="color:#38bdf8;">Chase 3D</strong></span>
      </div>

      <!-- Top-Right: Minimal Camera & Lighting Toggles -->
      <div class="hud-card btn-row">
        <button class="hud-btn accent" id="btn-cam" title="Cycle 3D Camera (C)">Camera (C)</button>
        <button class="hud-btn" id="btn-consist" title="Toggle Trailing Cars">Consist</button>
        <button class="hud-btn" id="btn-horn" title="Sound Horn (H)">Horn (H)</button>
        <button class="hud-btn" id="btn-sky" title="Toggle Dusk / Day">Dusk / Day</button>
      </div>
    </div>

    <div class="hud-row bottom">
      <!-- Bottom-Left: Sleek Speedometer, Throttle, Reverser & Brake Indicator -->
      <div class="hud-card">
        <div class="telemetry-cluster">
          <div class="speed-readout">
            <span class="speed-number" id="speed-val">0.0</span>
            <span class="speed-unit">km/h</span>
          </div>
          <div class="metric-box">
            <span class="metric-label">Throttle</span>
            <span class="metric-value amber" id="throttle-val">N3</span>
          </div>
          <div class="metric-box">
            <span class="metric-label">Reverser</span>
            <span class="metric-value cyan" id="reverser-val">FWD</span>
          </div>
          <div class="metric-box">
            <span class="metric-label">Brake</span>
            <span class="metric-value" id="brake-val">0% (90 PSI)</span>
          </div>
        </div>
      </div>

      <!-- Bottom-Right: Sleek Controls (W/S Throttle, A/D Reverser, Space Brake) -->
      <div class="hud-card btn-row">
        <button class="hud-btn" id="btn-thr-dn" title="Decrease Throttle (S)">Throttle - (S)</button>
        <button class="hud-btn accent" id="btn-thr-up" title="Increase Throttle (W)">Throttle + (W)</button>
        <button class="hud-btn" id="btn-rev" title="Reverser (A/D)">Rev (A/D)</button>
        <button class="hud-btn" id="btn-brake" title="Apply/Release Brake (Space)">Brake (Space)</button>
      </div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // =========================================================================
    // 1. 3D PERSPECTIVE CAMERA (FOV 65) & SHADOW-MAPPED WEBGL RENDERER
    // =========================================================================
    const container = document.getElementById('webgl-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0xd88c6a, 0.00095);

    // Mandate 1: THREE.PerspectiveCamera (FOV 60-75)
    const camera = new THREE.PerspectiveCamera(
      65,
      window.innerWidth / window.innerHeight,
      0.5,
      2000
    );

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: 'high-performance'
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    // Mandate 5: Enable real-time 3D shadow map
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    container.appendChild(renderer.domElement);

    const orbitControls = new OrbitControls(camera, renderer.domElement);
    orbitControls.enableDamping = true;
    orbitControls.dampingFactor = 0.06;
    orbitControls.maxPolarAngle = Math.PI * 0.48;
    orbitControls.minDistance = 9;
    orbitControls.maxDistance = 160;
    orbitControls.enabled = false;

    // =========================================================================
    // 2. SKY DOME (BLUE-TO-ORANGE DUSK GRADIENT) & HEMISPHERE + SUN LIGHTS
    // =========================================================================
    const skyGeo = new THREE.SphereGeometry(1500, 32, 24);
    const skyVertexShader = `
      varying vec3 vWorldPosition;
      void main() {
        vec4 worldPosition = modelMatrix * vec4(position, 1.0);
        vWorldPosition = worldPosition.xyz;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `;
    const skyFragmentShader = `
      uniform vec3 topColor;
      uniform vec3 midColor;
      uniform vec3 bottomColor;
      varying vec3 vWorldPosition;
      void main() {
        float h = normalize(vWorldPosition).y;
        vec3 col = mix(bottomColor, midColor, smoothstep(-0.04, 0.20, h));
        col = mix(col, topColor, smoothstep(0.20, 0.75, h));
        gl_FragColor = vec4(col, 1.0);
      }
    `;
    const skyUniforms = {
      topColor: { value: new THREE.Color(0x173168) },
      midColor: { value: new THREE.Color(0x6988b8) },
      bottomColor: { value: new THREE.Color(0xf59556) }
    };
    const skyMat = new THREE.ShaderMaterial({
      vertexShader: skyVertexShader,
      fragmentShader: skyFragmentShader,
      uniforms: skyUniforms,
      side: THREE.BackSide,
      depthWrite: false
    });
    const skyDome = new THREE.Mesh(skyGeo, skyMat);
    scene.add(skyDome);

    const sunSphere = new THREE.Mesh(
      new THREE.SphereGeometry(42, 24, 24),
      new THREE.MeshBasicMaterial({ color: 0xffd584, fog: false })
    );
    sunSphere.position.set(-560, 165, -780);
    scene.add(sunSphere);

    // Mandate 4d: THREE.HemisphereLight for sky/ground ambient illumination
    const hemiLight = new THREE.HemisphereLight(0xffebd6, 0x2a4726, 0.92);
    hemiLight.position.set(0, 220, 0);
    scene.add(hemiLight);

    // Mandate 5: THREE.DirectionalLight simulating the sun with real-time 3D shadows
    const sunLight = new THREE.DirectionalLight(0xfff0d6, 2.5);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    sunLight.shadow.camera.near = 10;
    sunLight.shadow.camera.far = 360;
    const dShadow = 90;
    sunLight.shadow.camera.left = -dShadow;
    sunLight.shadow.camera.right = dShadow;
    sunLight.shadow.camera.top = dShadow;
    sunLight.shadow.camera.bottom = -dShadow;
    sunLight.shadow.bias = -0.0005;
    scene.add(sunLight);
    scene.add(sunLight.target);

    // =========================================================================
    // 3. 3D SPLINE ROUTE (ROLLING HILLS & SCENIC CURVES)
    // =========================================================================
    const WAYPOINT_COUNT = 36;
    const routeWaypoints = [];
    const baseLoopRadius = 400;
    for (let i = 0; i < WAYPOINT_COUNT; i++) {
      const theta = (i / WAYPOINT_COUNT) * Math.PI * 2;
      const radialOffset = Math.sin(theta * 3) * 62 + Math.cos(theta * 2) * 38;
      const r = baseLoopRadius + radialOffset;
      const x = Math.cos(theta) * r;
      const z = Math.sin(theta) * r;
      const y = Math.sin(theta * 2) * 8.0 + Math.cos(theta * 4) * 3.8 + 4.5;
      routeWaypoints.push(new THREE.Vector3(x, y, z));
    }
    const trackSpline = new THREE.CatmullRomCurve3(routeWaypoints, true, 'centripetal', 0.5);
    const TOTAL_TRACK_LENGTH = trackSpline.getLength();

    const TRACK_SAMPLES = 720;
    const sampledTrack = [];
    for (let i = 0; i < TRACK_SAMPLES; i++) {
      sampledTrack.push(trackSpline.getPointAt(i / TRACK_SAMPLES));
    }

    function getNearestTrackSample(wx, wz) {
      let bestDistSq = Infinity;
      let trackY = 0;
      for (let i = 0; i < TRACK_SAMPLES; i++) {
        const pt = sampledTrack[i];
        const dx = wx - pt.x;
        const dz = wz - pt.z;
        const dSq = dx * dx + dz * dz;
        if (dSq < bestDistSq) {
          bestDistSq = dSq;
          trackY = pt.y;
        }
      }
      return { dist: Math.sqrt(bestDistSq), trackY };
    }

    function evalHillHeight(x, z) {
      return (
        Math.sin(x * 0.0075) * Math.cos(z * 0.0075) * 27.0 +
        Math.sin(x * 0.02 + z * 0.016) * 9.2 +
        Math.cos(x * 0.042 - z * 0.035) * 3.0 +
        2.0
      );
    }

    // =========================================================================
    // 4. 3D TERRAIN (PLANEGEOMETRY WITH VERTEX DISPLACEMENT, GRASS GREEN)
    // =========================================================================
    const terrainSize = 1600;
    const terrainSegs = 180;
    const terrainGeo = new THREE.PlaneGeometry(terrainSize, terrainSize, terrainSegs, terrainSegs);
    terrainGeo.rotateX(-Math.PI / 2);

    const posAttr = terrainGeo.attributes.position;
    const colorAttr = new Float32Array(posAttr.count * 3);
    const grassDark = new THREE.Color(0x2d5e26);
    const grassBright = new THREE.Color(0x4b8336);
    const mountainRock = new THREE.Color(0x6b7568);
    const embankmentSoil = new THREE.Color(0x544e45);
    const tempCol = new THREE.Color();

    for (let i = 0; i < posAttr.count; i++) {
      const vx = posAttr.getX(i);
      const vz = posAttr.getZ(i);
      const hillY = evalHillHeight(vx, vz);
      const nearest = getNearestTrackSample(vx, vz);

      let y = hillY;
      let cutBlend = 0;
      if (nearest.dist < 35) {
        cutBlend = 1.0 - THREE.MathUtils.smoothstep(nearest.dist, 4.4, 35.0);
        y = THREE.MathUtils.lerp(hillY, nearest.trackY - 0.36, cutBlend);
      }
      posAttr.setY(i, y);

      if (cutBlend > 0.68) {
        tempCol.copy(embankmentSoil).lerp(grassBright, 1.0 - cutBlend);
      } else if (y > 17) {
        tempCol.copy(grassBright).lerp(mountainRock, Math.min(1, (y - 17) / 18));
      } else {
        tempCol.copy(grassDark).lerp(grassBright, THREE.MathUtils.clamp((y + 10) / 26, 0, 1));
      }
      colorAttr[i * 3] = tempCol.r;
      colorAttr[i * 3 + 1] = tempCol.g;
      colorAttr[i * 3 + 2] = tempCol.b;
    }

    terrainGeo.setAttribute('color', new THREE.BufferAttribute(colorAttr, 3));
    terrainGeo.computeVertexNormals();

    const terrainMat = new THREE.MeshStandardMaterial({
      vertexColors: true,
      roughness: 0.88,
      metalness: 0.04
    });
    const terrainMesh = new THREE.Mesh(terrainGeo, terrainMat);
    terrainMesh.receiveShadow = true;
    scene.add(terrainMesh);

    // =========================================================================
    // 5. 3D TRACK: GRAVEL BALLAST, 3D BOX SLEEPERS & 3D CYLINDER/TUBE RAILS
    // =========================================================================
    const RAIL_GAUGE = 1.435;
    const HALF_GAUGE = RAIL_GAUGE * 0.5;
    const upAxis = new THREE.Vector3(0, 1, 0);

    const BALLAST_STEPS = 920;
    const leftRailPts = [];
    const rightRailPts = [];
    const ballastVerts = [];
    const ballastNorms = [];
    const ballastIdxs = [];

    for (let i = 0; i <= BALLAST_STEPS; i++) {
      const u = (i % BALLAST_STEPS) / BALLAST_STEPS;
      const pt = trackSpline.getPointAt(u);
      const tangent = trackSpline.getTangentAt(u).normalize();
      const right = new THREE.Vector3().crossVectors(tangent, upAxis).normalize();

      leftRailPts.push(pt.clone().addScaledVector(right, -HALF_GAUGE).add(new THREE.Vector3(0, 0.15, 0)));
      rightRailPts.push(pt.clone().addScaledVector(right, HALF_GAUGE).add(new THREE.Vector3(0, 0.15, 0)));

      const pLOut = pt.clone().addScaledVector(right, -2.55).add(new THREE.Vector3(0, -0.40, 0));
      const pLTop = pt.clone().addScaledVector(right, -1.60).add(new THREE.Vector3(0, -0.03, 0));
      const pRTop = pt.clone().addScaledVector(right, 1.60).add(new THREE.Vector3(0, -0.03, 0));
      const pROut = pt.clone().addScaledVector(right, 2.55).add(new THREE.Vector3(0, -0.40, 0));

      ballastVerts.push(
        pLOut.x, pLOut.y, pLOut.z,
        pLTop.x, pLTop.y, pLTop.z,
        pRTop.x, pRTop.y, pRTop.z,
        pROut.x, pROut.y, pROut.z
      );
      for (let k = 0; k < 4; k++) ballastNorms.push(0, 1, 0);

      if (i < BALLAST_STEPS) {
        const b = i * 4;
        const n = (i + 1) * 4;
        for (let s = 0; s < 3; s++) {
          ballastIdxs.push(b + s, n + s, b + s + 1);
          ballastIdxs.push(b + s + 1, n + s, n + s + 1);
        }
      }
    }

    const ballastGeo = new THREE.BufferGeometry();
    ballastGeo.setAttribute('position', new THREE.Float32BufferAttribute(ballastVerts, 3));
    ballastGeo.setAttribute('normal', new THREE.Float32BufferAttribute(ballastNorms, 3));
    ballastGeo.setIndex(ballastIdxs);
    ballastGeo.computeVertexNormals();

    const ballastMesh = new THREE.Mesh(
      ballastGeo,
      new THREE.MeshStandardMaterial({
        color: 0x615b53,
        roughness: 0.94,
        metalness: 0.05
      })
    );
    ballastMesh.receiveShadow = true;
    scene.add(ballastMesh);

    // 3D Steel Rails
    const leftRailCurve = new THREE.CatmullRomCurve3(leftRailPts.slice(0, -1), true);
    const rightRailCurve = new THREE.CatmullRomCurve3(rightRailPts.slice(0, -1), true);
    const steelRailMat = new THREE.MeshStandardMaterial({
      color: 0xd1d5db,
      metalness: 0.88,
      roughness: 0.22
    });

    const leftRailMesh = new THREE.Mesh(new THREE.TubeGeometry(leftRailCurve, 920, 0.058, 6, true), steelRailMat);
    leftRailMesh.castShadow = true;
    leftRailMesh.receiveShadow = true;
    scene.add(leftRailMesh);

    const rightRailMesh = new THREE.Mesh(new THREE.TubeGeometry(rightRailCurve, 920, 0.058, 6, true), steelRailMat);
    rightRailMesh.castShadow = true;
    rightRailMesh.receiveShadow = true;
    scene.add(rightRailMesh);

    // Instanced 3D Wooden Sleepers (BoxGeometry)
    const SLEEPER_COUNT = 2200;
    const sleeperGeo = new THREE.BoxGeometry(2.55, 0.15, 0.25);
    const sleeperMat = new THREE.MeshStandardMaterial({
      color: 0x3e2c20,
      roughness: 0.88,
      metalness: 0.06
    });
    const sleeperInstanced = new THREE.InstancedMesh(sleeperGeo, sleeperMat, SLEEPER_COUNT);
    sleeperInstanced.castShadow = true;
    sleeperInstanced.receiveShadow = true;

    const xformDummy = new THREE.Object3D();
    for (let i = 0; i < SLEEPER_COUNT; i++) {
      const u = i / SLEEPER_COUNT;
      const pt = trackSpline.getPointAt(u);
      const tangent = trackSpline.getTangentAt(u);
      xformDummy.position.set(pt.x, pt.y + 0.03, pt.z);
      xformDummy.lookAt(pt.clone().add(tangent));
      xformDummy.updateMatrix();
      sleeperInstanced.setMatrixAt(i, xformDummy.matrix);
    }
    sleeperInstanced.instanceMatrix.needsUpdate = true;
    scene.add(sleeperInstanced);

    // =========================================================================
    // 6. INSTANCED 3D TREES (BROWN CYLINDER TRUNK + GREEN CONE LEAVES)
    // =========================================================================
    const TREE_COUNT = 680;
    const trunkGeo = new THREE.CylinderGeometry(0.28, 0.44, 3.2, 7);
    trunkGeo.translate(0, 1.6, 0);
    const trunkMat = new THREE.MeshStandardMaterial({
      color: 0x5c3a21,
      roughness: 0.92,
      metalness: 0.02
    });

    const coneLowerGeo = new THREE.ConeGeometry(2.35, 5.4, 8);
    coneLowerGeo.translate(0, 4.9, 0);
    const coneUpperGeo = new THREE.ConeGeometry(1.7, 4.3, 8);
    coneUpperGeo.translate(0, 7.3, 0);
    const leavesMat = new THREE.MeshStandardMaterial({
      color: 0x255928,
      roughness: 0.80,
      metalness: 0.04
    });

    const trunkMeshInst = new THREE.InstancedMesh(trunkGeo, trunkMat, TREE_COUNT);
    const coneLowMeshInst = new THREE.InstancedMesh(coneLowerGeo, leavesMat, TREE_COUNT);
    const coneHighMeshInst = new THREE.InstancedMesh(coneUpperGeo, leavesMat, TREE_COUNT);

    trunkMeshInst.castShadow = true;
    trunkMeshInst.receiveShadow = true;
    coneLowMeshInst.castShadow = true;
    coneLowMeshInst.receiveShadow = true;
    coneHighMeshInst.castShadow = true;
    coneHighMeshInst.receiveShadow = true;

    let rngState = 24681357;
    function nextRand() {
      rngState = (rngState * 1664525 + 1013904223) % 4294967296;
      return rngState / 4294967296;
    }

    let placed = 0;
    let tries = 0;
    while (placed < TREE_COUNT && tries < 5500) {
      tries++;
      const tx = (nextRand() - 0.5) * 1300;
      const tz = (nextRand() - 0.5) * 1300;
      const nearest = getNearestTrackSample(tx, tz);
      if (nearest.dist < 11.0 || nearest.dist > 600) continue;

      let ty = evalHillHeight(tx, tz);
      if (nearest.dist < 35) {
        const blend = 1.0 - THREE.MathUtils.smoothstep(nearest.dist, 4.4, 35.0);
        ty = THREE.MathUtils.lerp(ty, nearest.trackY - 0.36, blend);
      }

      const s = 0.78 + nextRand() * 0.78;
      xformDummy.position.set(tx, ty - 0.2, tz);
      xformDummy.rotation.set(0, nextRand() * Math.PI * 2, 0);
      xformDummy.scale.set(s, s, s);
      xformDummy.updateMatrix();

      trunkMeshInst.setMatrixAt(placed, xformDummy.matrix);
      coneLowMeshInst.setMatrixAt(placed, xformDummy.matrix);
      coneHighMeshInst.setMatrixAt(placed, xformDummy.matrix);
      placed++;
    }
    trunkMeshInst.instanceMatrix.needsUpdate = true;
    coneLowMeshInst.instanceMatrix.needsUpdate = true;
    coneHighMeshInst.instanceMatrix.needsUpdate = true;
    scene.add(trunkMeshInst);
    scene.add(coneLowMeshInst);
    scene.add(coneHighMeshInst);

    // 3D Trackside Signals & Station Platform
    const poleMat = new THREE.MeshStandardMaterial({ color: 0x64748b, metalness: 0.75, roughness: 0.32 });
    const signalBoxMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, metalness: 0.5, roughness: 0.4 });
    for (let i = 0; i < 8; i++) {
      const u = i / 8;
      const pt = trackSpline.getPointAt(u);
      const tangent = trackSpline.getTangentAt(u).normalize();
      const right = new THREE.Vector3().crossVectors(tangent, upAxis).normalize();

      const sigGroup = new THREE.Group();
      const pos = pt.clone().addScaledVector(right, 3.1);
      sigGroup.position.copy(pos);
      sigGroup.lookAt(pos.clone().subtract(tangent));

      const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.11, 5.4, 10), poleMat);
      mast.position.y = 2.7;
      mast.castShadow = true;
      sigGroup.add(mast);

      const housing = new THREE.Mesh(new THREE.BoxGeometry(0.46, 1.32, 0.34), signalBoxMat);
      housing.position.set(0, 5.05, 0.12);
      housing.castShadow = true;
      sigGroup.add(housing);

      const greenLens = new THREE.Mesh(
        new THREE.CylinderGeometry(0.14, 0.14, 0.12, 12),
        new THREE.MeshStandardMaterial({ color: 0x22c55e, emissive: 0x22c55e, emissiveIntensity: 2.4 })
      );
      greenLens.rotation.x = Math.PI / 2;
      greenLens.position.set(0, 5.05, 0.30);
      sigGroup.add(greenLens);

      scene.add(sigGroup);
    }

    // =========================================================================
    // 7. DETAILED 3D LOCOMOTIVE (BOX + CYLINDER PRIMITIVES, 8 WHEELS, BOGIES)

    let cabThrottleLever = null;

      for (const side of [-0.18, 0.18]) {

      // 6. Safety Handrails along Walkways
      const railYellowMat = new THREE.MeshStandardMaterial({ color: 0xfde047, metalness: 0.4, roughness: 0.35 });
      for (const sx of [-1.48, 1.48]) {
        const handrail = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 10.4, 8), railYellowMat);

      // 7. Cab Interior Control Stand & Animated Levers (for Cab Camera)
      const cabDesk = new THREE.Mesh(new THREE.BoxGeometry(0.96, 0.66, 0.56), chassisDarkMat);

      cabThrottleLever = new THREE.Mesh(new THREE.CylinderGeometry(0.032, 0.032, 0.40, 8), paintYellowMat);
      cabThrottleLever.position.set(-0.42, 3.14, 5.25);
      loco.add(cabThrottleLever);

      cabBrakeLever = new THREE.Mesh(
        new THREE.CylinderGeometry(0.032, 0.032, 0.36, 8),

      // 8. Front & Rear Bogies (Trucks) with 8 Cylinder Wheels (4 Axles x 2 Wheels)
      const bogieZPositions = [4.9, -4.9];
      const axleLocalZ = [-1.15, 1.15];

      for (const bz of bogieZPositions) {
        const bogieGroup = new THREE.Group();

        // Truck Sideframes & Bolster
        for (const sx of [-0.96, 0.96]) {
          const sideFrame = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.44, 3.45), chassisDarkMat);

        // 2 Axles per bogie = 4 wheels per bogie (8 Cylinder Wheels total)
        for (const az of axleLocalZ) {

          for (const wx of [-0.74, 0.74]) {

            const flange = new THREE.Mesh(new THREE.CylinderGeometry(0.58, 0.58, 0.04, 20), chassisDarkMat);

    // Optional Trailing Rolling Stock (Flatbed Log Car + Tanker Car)

      const frameMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.72, roughness: 0.38 });
      const cargoMat = new THREE.MeshStandardMaterial({ color: colorHex, metalness: 0.45, roughness: 0.35 });
      const wheelMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, metalness: 0.85, roughness: 0.22 });

      const bed = new THREE.Mesh(new THREE.BoxGeometry(2.9, 0.38, 13.6), frameMat);
      bed.position.y = 1.05;
      bed.castShadow = true;
      wagon.add(bed);

      const tank = new THREE.Mesh(new THREE.CylinderGeometry(1.12, 1.12, 11.8, 18), cargoMat);
      tank.rotation.x = Math.PI / 2;
      tank.position.y = 2.32;
      tank.castShadow = true;
      tank.receiveShadow = true;
      wagon.add(tank);

      for (const bz of [4.2, -4.2]) {
        const bogie = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.36, 2.3), frameMat);
        bogie.position.set(0, 0.54, bz);
        wagon.add(bogie);
        for (const az of [-0.72, 0.72]) {
          const axle = new THREE.Group();
          axle.position.set(0, 0.52, bz + az);
          for (const wx of [-0.74, 0.74]) {
            const w = new THREE.Mesh(new THREE.CylinderGeometry(0.48, 0.48, 0.15, 16), wheelMat);
            w.rotation.z = Math.PI / 2;
            w.position.x = wx;
            w.castShadow = true;
            axle.add(w);
          }
          wagon.add(axle);
          wheelAxleGroups.push(axle);
        }
      }
      return wagon;
    }

    const locomotiveMesh = createDetailed3DLocomotive();
    scene.add(locomotiveMesh);

    const trailingCars = [
      createFreightWagon(0x0284c7),
      createFreightWagon(0xb45309)
    ];
    let consistAttached = false;
    for (const car of trailingCars) {
      car.visible = consistAttached;
      scene.add(car);
    }

    // 3D Diesel Exhaust Smoke Pool
    const smokePool = [];
    const smokeGeo = new THREE.SphereGeometry(0.42, 8, 8);
    const smokeBaseMat = new THREE.MeshStandardMaterial({
      color: 0xd1d5db,
      roughness: 0.95,
      transparent: true,
      opacity: 0.5
    });
    for (let i = 0; i < 22; i++) {
      const m = new THREE.Mesh(smokeGeo, smokeBaseMat.clone());
      m.visible = false;
      scene.add(m);
      smokePool.push({ mesh: m, life: 0, maxLife: 1.4, vy: 0 });
    }

    // =========================================================================
    // 8. PHYSICS, CONTROLS & CAMERA CONTROLLER (CHASE, CAB, ORBIT)
    // =========================================================================
    const simState = {
      distanceMeters: 65.0,
      speedMps: 12.0,
      throttleNotch: 3,
      reverser: 1, // 1 = FWD, 0 = NEU, -1 = REV
      brakePercent: 0,
      brakePipePsi: 90,
      gradientPercent: 0,
      cameraMode: 0, // 0 = Chase 3D (Default), 1 = Cab 3D, 2 = Orbit 3D
      isDusk: true
    };

    let audioCtx = null;
    function playHornChord() {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        if (!audioCtx) audioCtx = new AC();
        const now = audioCtx.currentTime;
        for (const freq of [311.13, 369.99, 493.88]) {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(0.065, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.75);
          osc.connect(gain).connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.75);
        }
      } catch (_) {}
    }

    function cycleCameraMode() {
      simState.cameraMode = (simState.cameraMode + 1) % 3;
      const modeNames = ['Chase 3D', 'Cab 3D', 'Orbit 3D'];
      document.getElementById('cam-label').textContent = modeNames[simState.cameraMode];
      orbitControls.enabled = simState.cameraMode === 2;
      if (simState.cameraMode === 2) {
        const u = ((simState.distanceMeters % TOTAL_TRACK_LENGTH) + TOTAL_TRACK_LENGTH) / TOTAL_TRACK_LENGTH;
        const pt = trackSpline.getPointAt(u);
        camera.position.set(pt.x + 18, pt.y + 10, pt.z + 18);
        orbitControls.target.copy(pt).add(new THREE.Vector3(0, 2.5, 0));
        orbitControls.update();
      }
    }

    function toggleConsist() {
      consistAttached = !consistAttached;
      for (const car of trailingCars) {
        car.visible = consistAttached;
      }
    }

    function toggleSkyMode() {
      simState.isDusk = !simState.isDusk;
      if (simState.isDusk) {
        skyUniforms.topColor.value.setHex(0x173168);
        skyUniforms.midColor.value.setHex(0x6988b8);
        skyUniforms.bottomColor.value.setHex(0xf59556);
        scene.fog.color.setHex(0xd88c6a);
        sunLight.color.setHex(0xfff0d6);
        sunLight.intensity = 2.5;
      } else {
        skyUniforms.topColor.value.setHex(0x1d4ed8);
        skyUniforms.midColor.value.setHex(0x60a5fa);
        skyUniforms.bottomColor.value.setHex(0xdbeafe);
        scene.fog.color.setHex(0xbfdbfe);
        sunLight.color.setHex(0xffffff);
        sunLight.intensity = 2.8;
      }
    }

    function handleSimKey(code) {
      switch (code) {
        case 'KeyW':
        case 'ArrowUp':
          simState.throttleNotch = Math.min(8, simState.throttleNotch + 1);
          if (simState.throttleNotch > 0) simState.brakePercent = 0;
          break;
        case 'KeyS':
        case 'ArrowDown':
          simState.throttleNotch = Math.max(0, simState.throttleNotch - 1);
          break;
        case 'KeyA':
          simState.reverser = Math.max(-1, simState.reverser - 1);
          break;
        case 'KeyD':
          simState.reverser = Math.min(1, simState.reverser + 1);
          break;
        case 'Space':
          simState.brakePercent = simState.brakePercent >= 75 ? 0 : simState.brakePercent + 25;
          if (simState.brakePercent > 0) simState.throttleNotch = 0;
          break;
        case 'KeyC':
          cycleCameraMode();
          break;
        case 'KeyH':
          playHornChord();
          break;
      }
    }

    // Expose global bridge for Android Activity hardware keys
    window.dispatchSimKey = handleSimKey;

    window.addEventListener('keydown', (e) => {
      handleSimKey(e.code);
    });

    document.getElementById('btn-thr-up').onclick = () => handleSimKey('KeyW');
    document.getElementById('btn-thr-dn').onclick = () => handleSimKey('KeyS');
    document.getElementById('btn-rev').onclick = () => {
      simState.reverser = simState.reverser === 1 ? -1 : 1;
    };
    document.getElementById('btn-brake').onclick = () => handleSimKey('Space');
    document.getElementById('btn-cam').onclick = cycleCameraMode;
    document.getElementById('btn-consist').onclick = toggleConsist;
    document.getElementById('btn-horn').onclick = playHornChord;
    document.getElementById('btn-sky').onclick = toggleSkyMode;

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function placeOnSpline(group, distMeters) {
      const wrapped = ((distMeters % TOTAL_TRACK_LENGTH) + TOTAL_TRACK_LENGTH) % TOTAL_TRACK_LENGTH;
      const u = wrapped / TOTAL_TRACK_LENGTH;
      const pt = trackSpline.getPointAt(u);
      const tangent = trackSpline.getTangentAt(u).normalize();
      group.position.copy(pt);
      group.lookAt(pt.clone().add(tangent));
      return { pt, tangent, u };
    }

    // =========================================================================
    // 9. MAIN 60 FPS ANIMATION & SPLINE PHYSICS LOOP
    // =========================================================================
    let prevTime = performance.now();
    let smokeAccum = 0;
    const desiredCamPos = new THREE.Vector3();
    const desiredCamLook = new THREE.Vector3();

    function animate(now) {
      requestAnimationFrame(animate);
      const dt = Math.min(0.05, (now - prevTime) / 1000);
      prevTime = now;

      // 1. Physics Integration along the 3D Spline
      const uNow = (((simState.distanceMeters % TOTAL_TRACK_LENGTH) + TOTAL_TRACK_LENGTH) % TOTAL_TRACK_LENGTH) / TOTAL_TRACK_LENGTH;
      const uAhead = (((simState.distanceMeters + 5) % TOTAL_TRACK_LENGTH) + TOTAL_TRACK_LENGTH) % TOTAL_TRACK_LENGTH / TOTAL_TRACK_LENGTH;
      const pNow = trackSpline.getPointAt(uNow);
      const pAhead = trackSpline.getPointAt(uAhead);
      simState.gradientPercent = ((pAhead.y - pNow.y) / 5.0) * 100.0;

      const targetPsi = 90 - simState.brakePercent * 0.26;
      simState.brakePipePsi += (targetPsi - simState.brakePipePsi) * dt * 4.0;

      const tractiveAccel = (simState.throttleNotch / 8.0) * 2.9 * simState.reverser;
      const gravityHillAccel = -9.81 * (simState.gradientPercent / 100.0);
      const rollingResistance = -simState.speedMps * 0.034;
      const brakeDecel = -Math.sign(simState.speedMps) * (simState.brakePercent / 100.0) * 4.4;

      simState.speedMps += (tractiveAccel + gravityHillAccel + rollingResistance + brakeDecel) * dt;
      if (simState.throttleNotch === 0 && simState.brakePercent > 15 && Math.abs(simState.speedMps) < 0.15) {
        simState.speedMps = 0;
      }
      simState.speedMps = THREE.MathUtils.clamp(simState.speedMps, -26, 44);
      simState.distanceMeters += simState.speedMps * dt;

      // 2. Position Detailed 3D Locomotive & Optional Consist on the Spline
      const locoPose = placeOnSpline(locomotiveMesh, simState.distanceMeters);
      if (consistAttached) {
        for (let i = 0; i < trailingCars.length; i++) {
          placeOnSpline(trailingCars[i], simState.distanceMeters - (i + 1) * 15.8);
        }
      }

      // 3. Spin all 8 Locomotive Cylinder Wheels + Animate Cab Levers
      const wheelDeltaRad = (simState.speedMps * dt) / 0.52;
      for (let i = 0; i < wheelAxleGroups.length; i++) {
        wheelAxleGroups[i].rotation.x += wheelDeltaRad;
      }
      if (cabThrottleLever) {
        cabThrottleLever.rotation.x = -0.4 + (simState.throttleNotch / 8) * 0.85;
      }
      if (cabBrakeLever) {
        cabBrakeLever.rotation.x = -0.3 + (simState.brakePercent / 100) * 0.75;
      }

      // 4. Update Real-Time Directional Shadow Light to follow the train
      sunLight.position.set(locoPose.pt.x - 62, locoPose.pt.y + 82, locoPose.pt.z - 52);
      sunLight.target.position.copy(locoPose.pt);

      // 5. Update 3D Diesel Exhaust Plumes
      smokeAccum += dt;
      if (smokeAccum > Math.max(0.05, 0.20 - simState.throttleNotch * 0.018)) {
        smokeAccum = 0;
        const p = smokePool.find((item) => item.life <= 0);
        if (p) {
          p.life = p.maxLife;
          p.vy = 2.5 + simState.throttleNotch * 0.42;
          p.mesh.position.copy(locoPose.pt).add(new THREE.Vector3(0, 4.35, 0));
          p.mesh.scale.setScalar(0.65);
          p.mesh.visible = true;
        }
      }
      for (const p of smokePool) {
        if (p.life > 0) {
          p.life -= dt;
          p.mesh.position.y += p.vy * dt;
          const t = 1.0 - p.life / p.maxLife;
          p.mesh.scale.setScalar(0.65 + t * 2.1);
          p.mesh.material.opacity = Math.max(0, (1.0 - t) * 0.44);
          if (p.life <= 0) p.mesh.visible = false;
        }
      }

      // 6. Update 3D Perspective Camera (Chase, Cab, Orbit)
      if (simState.cameraMode === 0) {
        // Default 3D Third-Person Chase Camera behind and above the locomotive looking down the tracks
        const rightVec = new THREE.Vector3().crossVectors(locoPose.tangent, upAxis).normalize();
        desiredCamPos
          .copy(locoPose.pt)
          .addScaledVector(locoPose.tangent, -17.5)
          .addScaledVector(rightVec, 3.4)
          .add(new THREE.Vector3(0, 6.4, 0));
        camera.position.lerp(desiredCamPos, 0.14);

        desiredCamLook
          .copy(locoPose.pt)
          .addScaledVector(locoPose.tangent, 16.0)
          .add(new THREE.Vector3(0, 2.1, 0));
        camera.lookAt(desiredCamLook);
      } else if (simState.cameraMode === 1) {
        // First-Person 3D Cab Interior View looking out the front windshield
        const cabEye = locoPose.pt
          .clone()
          .addScaledVector(locoPose.tangent, 4.4)
          .add(new THREE.Vector3(0, 3.35, 0));
        camera.position.copy(cabEye);
        camera.lookAt(cabEye.clone().addScaledVector(locoPose.tangent, 36.0).add(new THREE.Vector3(0, -1.2, 0)));
      } else {
        orbitControls.target.copy(locoPose.pt).add(new THREE.Vector3(0, 2.4, 0));
        orbitControls.update();
      }

      // 7. Update Minimal Transparent Corner HUD
      document.getElementById('speed-val').textContent = (Math.abs(simState.speedMps) * 3.6).toFixed(1);
      document.getElementById('throttle-val').textContent = 'N' + simState.throttleNotch;
      document.getElementById('reverser-val').textContent =
        simState.reverser === 1 ? 'FWD' : simState.reverser === -1 ? 'REV' : 'NEU';
      const brkEl = document.getElementById('brake-val');
      brkEl.textContent = `${Math.round(simState.brakePercent)}% (${Math.round(simState.brakePipePsi)} PSI)`;
      brkEl.className = simState.brakePercent > 0 ? 'metric-value red' : 'metric-value';
      document.getElementById('grade-val').textContent =
        (simState.gradientPercent >= 0 ? '+' : '') + simState.gradientPercent.toFixed(1) + '%';

      renderer.render(scene, camera);
    }

    // Snap initial 3D Chase Camera immediately behind and above the locomotive on Frame 0
    const startPose = placeOnSpline(locomotiveMesh, simState.distanceMeters);
    const startRight = new THREE.Vector3().crossVectors(startPose.tangent, upAxis).normalize();
    camera.position
      .copy(startPose.pt)
      .addScaledVector(startPose.tangent, -17.5)
      .addScaledVector(startRight, 3.4)
      .add(new THREE.Vector3(0, 6.4, 0));
    camera.lookAt(startPose.pt.clone().addScaledVector(startPose.tangent, 16.0).add(new THREE.Vector3(0, 2.1, 0)));

    requestAnimationFrame(animate);
  </script>
</body>
</html>
