name: Android CI Build & Artifact

on:
  push:
    branches: [ "main", "master", "**" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build IronRail 3D Sim APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses & Install SDK 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true

      - name: Prepare .env for Secrets Gradle Plugin
        env:
          SECRET_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cp .env.example .env
          if [ -n "$SECRET_GEMINI_API_KEY" ]; then
            echo "Injecting GEMINI_API_KEY from GitHub Actions Secrets into .env"
            sed -i "s|^GEMINI_API_KEY=.*|GEMINI_API_KEY=${SECRET_GEMINI_API_KEY}|" .env
          fi

      - name: Restore debug.keystore from debug.keystore.base64
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 --decode debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Run Unit Tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IronRail-3D-Sim-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
